<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>First Keys — Piano Lessons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2a2420; --soft:#6f655c; --line:#e4dccd;
  --accent:#c2562f; --accent-soft:#f6dfd3; --ok:#3f8f5a; --ok-soft:#dcefe1;
  --blue:#4a7bd0; --purple:#8a5cc7; --gold:#e0a526;
  --kb-h:132px; --bar-h:40px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex:0 0 auto}
header h1{font-family:Fraunces,Georgia,serif;font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:none;color:var(--accent);font-weight:600;padding:4px 2px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--soft);white-space:nowrap}
.pill.on{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.tap{color:var(--purple);border-color:#cdb8ea}
main{flex:1 1 auto;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
h2{font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.2;margin:0 0 10px}
.txt p{margin:0 0 10px}
.prompt{font-size:19px;margin:0 0 6px}
.fb{min-height:52px;margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:#f4eee3;color:var(--soft);font-size:16px}
.fb.good{background:var(--ok-soft);color:#24593a}
.fb.miss{background:#fbeedc;color:#7a5413}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:600;font-size:17px}
.primary:disabled{opacity:.4}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:500}
.ghost.on{border-color:var(--gold);background:#fbf0d4}
.link{background:none;border:none;color:var(--soft);text-decoration:underline;padding:8px 4px;font-size:15px}
.tag{display:inline-block;padding:0 7px;border-radius:6px;font-size:14px;font-weight:600}
.tag.hint{background:#fbe7b5;color:#7a5413}.tag.blue{background:#dbe6f8;color:#2d58a3}.tag.purple{background:#e9def7;color:#5e3a96}
.progress{display:flex;gap:5px;margin:0 0 12px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.d{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{min-width:46px;text-align:center;padding:8px 6px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:19px;line-height:1.1}
.chip small{display:block;font-size:12px;color:var(--soft);font-weight:500}
.chip.done{background:var(--ok-soft);border-color:#a9d3b5;color:#24593a}
.chip.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
.staffbox{margin:10px 0 4px;overflow-x:auto}
.staffbox svg{display:block;width:100%;height:auto}
.staffline{stroke:#5b524a;stroke-width:1.2}
.clef{font-family:'Noto Music','Apple Symbols','Segoe UI Symbol',serif;fill:#3b342e}
.nh{fill:#2a2420}.stem{stroke:#2a2420;stroke-width:1.6}
.n-done .nh{fill:var(--ok)}.n-done .stem{stroke:var(--ok)}
.n-cur .nh{fill:var(--accent)}.n-cur .stem{stroke:var(--accent)}
.n-cur .mark{fill:var(--accent)}
.lab{font-size:14px;fill:var(--soft);text-anchor:middle;font-family:Inter,sans-serif}
.lab.nm{font-weight:600;fill:#3b342e}.lab.fg{font-size:12px}
.nh.hol{fill:var(--card);stroke:#2a2420;stroke-width:1.8}.flag{fill:none;stroke:#2a2420;stroke-width:1.6}
.n-done .nh.hol,.n-ok .nh.hol{fill:var(--card);stroke:var(--ok)}.n-cur .nh.hol{fill:var(--card);stroke:var(--accent)}
.n-ok .nh{fill:var(--ok)}.n-ok .stem,.n-ok .flag,.n-done .flag{stroke:var(--ok)}.n-cur .flag{stroke:var(--accent)}
.n-early .nh,.n-late .nh{fill:#d39a1c}.n-early .stem,.n-late .stem,.n-early .flag,.n-late .flag{stroke:#d39a1c}.n-early .nh.hol,.n-late .nh.hol{fill:var(--card);stroke:#d39a1c}
.n-miss .nh{fill:#c9c0b4}.n-miss .stem,.n-miss .flag{stroke:#c9c0b4}.n-miss .nh.hol{fill:var(--card);stroke:#c9c0b4}
.lab.tg{font-size:10px;fill:#a77510;font-weight:600}
.anna{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.anna .av{flex:0 0 40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:15px;border:1.5px solid #e9bfa9}
.anna .bubble{background:#fff6ea;border:1px solid #efdcc4;border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:16px}
.anna .bubble p{margin:0 0 6px}.anna .bubble p:last-child{margin:0}
.who{font-size:12px;color:var(--soft);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.prac{background:linear-gradient(160deg,#fff6ea,#fbe7d7);border:1px solid #efcfb6;border-radius:18px;padding:16px;margin-top:16px}
.prac h3{font-family:Fraunces,Georgia,serif;font-size:21px;margin:0 0 4px}
.section-h{font-family:Fraunces,Georgia,serif;font-size:19px;margin:22px 0 8px}
.lesson.dim{opacity:.55}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px;font-size:14px;color:var(--soft)}
.opts .seg{margin:0}
.seg.sm button{padding:6px 10px;font-size:14px}
.count{font-family:Fraunces,Georgia,serif;font-size:40px;text-align:center;color:var(--accent);min-height:52px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{background:#f4eee3;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--soft)}
.stats b{display:block;font-size:22px;color:var(--ink)}
.n-done .lab.nm{fill:var(--ok)}.n-cur .lab.nm{fill:var(--accent)}
.lessons{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink)}
.lesson .num{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.lesson.done .num{background:var(--ok-soft);color:var(--ok)}
.lesson b{display:block;font-weight:600}.lesson span{font-size:14px;color:var(--soft)}
.hero{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.15;margin:6px 0 6px}
.sub{color:var(--soft);margin:0}
.big{font-size:44px;text-align:center;margin:4px 0}
/* listen bar + keyboard */
#bar{flex:0 0 var(--bar-h);display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);background:#efe8da;font-size:14px;color:var(--soft)}
#heard{min-width:92px;font-weight:600;color:var(--ink)}
#meter{flex:1;height:6px;border-radius:3px;background:#ddd3c2;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
#barbtn{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
#kbwrap{flex:0 0 var(--kb-h);background:#2b2522;padding:6px 6px calc(8px + env(safe-area-inset-bottom));touch-action:none}
#kb{position:relative;height:100%;display:flex;max-width:720px;margin:0 auto;user-select:none;-webkit-user-select:none}
.key{position:relative}
.key.w{flex:1;background:#fdfbf6;border:1px solid #9b9187;border-radius:0 0 6px 6px;margin:0 1px}
.key.b{position:absolute;top:0;height:60%;background:#1c1816;border-radius:0 0 4px 4px;z-index:2;box-shadow:inset 0 -3px 0 #3b3430}
.key .lbl{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:12px;color:#8b8177;font-weight:600;pointer-events:none}
.key .fing{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:var(--accent);font-weight:700;pointer-events:none}
.key .dot{position:absolute;bottom:42px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent);pointer-events:none}
.key.w.hl{background:#dbe6f8}.key.b.hl{background:var(--blue)}
.key.w.hl2{background:#e9def7}.key.b.hl2{background:var(--purple)}
.key.w.hint{background:#fbe2a0}.key.b.hint{background:var(--gold)}
.key.w.hint,.key.b.hint{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.12)}}
.key.w.press{background:#bfe3c9!important}.key.b.press{background:var(--ok)!important}
.hide-labels .lbl{display:none}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.show{display:flex}
#sheet .card{width:100%;max-width:520px;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 14px}
.seg button{flex:1;border:none;background:#fff;padding:9px 4px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
@media (min-height:760px){:root{--kb-h:160px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="hdrBack" style="display:none">‹ Home</button>
    <h1 id="hdrTitle">First Keys</h1>
    <button class="pill" id="pill">Mic off</button>
  </header>
  <main id="main"><div class="wrap" id="screen"></div></main>
  <div id="bar"><span id="heard">—</span><div id="meter"><i></i></div><button id="barbtn">Listen</button></div>
  <div id="kbwrap"><div id="kb"></div></div>
</div>
<div id="sheet"><div class="card" id="sheetCard"></div></div>

<script>
"use strict";
/* ---------- basics ---------- */
const $=s=>document.querySelector(s);
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const pcOf=m=>((m%12)+12)%12;
const nm=m=>NAMES[pcOf(m)];
const isBlack=m=>[1,3,6,8,10].includes(pcOf(m));
const LETTER={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
const store={get(k,d){try{const v=localStorage.getItem('fk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('fk_'+k,JSON.stringify(v))}catch(e){}}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const PRAISE=['Nice!','Yes — that\'s it!','Lovely.','You got it!','Spot on!','Beautiful.','Perfect.','There it is!'];

/* ---------- sound ---------- */
let ctx=null, muteUntil=0;
function ac(){
  if(!ctx){const C=window.AudioContext||window.webkitAudioContext; ctx=new C();}
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
let synthLog=[];   // accompaniment notes the mic might overhear
function tone(midi,when=0,dur=0.9,o={}){
  let c; try{c=ac();}catch(e){return;}
  const t=c.currentTime+when, f=440*Math.pow(2,(midi-69)/12);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol||0.32,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const o1=c.createOscillator(); o1.type=o.pure?'sine':'triangle'; o1.frequency.value=f;
  const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
  const g2=c.createGain(); g2.gain.value=o.pure?0:0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(o.dest||c.destination);
  o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  if(o.accomp){const st=performance.now()+when*1000; synthLog.push({pc:pcOf(midi),start:st,end:st+dur*1000});}
  if(!o.noMute) muteUntil=Math.max(muteUntil, performance.now()+(when+dur)*1000+250);
}
function click(at,accent,dest){
  let c; try{c=ac();}catch(e){return;}
  const o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.value=accent?2600:2000;
  g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(accent?0.3:0.16,at+0.003); g.gain.exponentialRampToValueAtTime(0.0001,at+0.035);
  o.connect(g); g.connect(dest||c.destination); o.start(at); o.stop(at+0.05);
}
function bleedOf(pc,t){
  const now=performance.now(); synthLog=synthLog.filter(e=>e.end>now-2000);
  let kind=null;
  for(const e of synthLog){ if(e.pc!==pc) continue;
    if(Math.abs(t-e.start)<220) return 'onset';
    if(t>=e.start&&t<=e.end+120) kind='sustain'; }
  return kind;
}
let demoBusy=false;
function playSeq(midis,step=0.5){
  if(demoBusy) return Promise.resolve();
  demoBusy=true;
  midis.forEach((m,i)=>{tone(m,i*step,0.75); setTimeout(()=>kb.flash(m),i*step*1000);});
  return new Promise(r=>setTimeout(()=>{demoBusy=false;r();},midis.length*step*1000+300));
}

/* ---------- listening ---------- */
let mic={state:'off'};   // off | on | denied | tap
const SENS={low:2.2,med:1,high:0.45};
let sens=store.get('sens','med');
let wakeLock=null;
async function startMic(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no media');
    const c=ac();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=c.createMediaStreamSource(stream);
    const an=c.createAnalyser(); an.fftSize=2048; src.connect(an);
    const fan=c.createAnalyser(); fan.fftSize=8192; fan.smoothingTimeConstant=0; src.connect(fan);
    const ring=[]; for(let i=0;i<6;i++) ring.push(new Float32Array(fan.frequencyBinCount));
    mic={state:'on',an,buf:new Float32Array(an.fftSize),sr:c.sampleRate,fan,ring,ri:0};
    try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
    setStatus(); return true;
  }catch(e){
    mic={state:'denied'}; setStatus(); return false;
  }
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&mic.state==='on'){try{if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
});

/* YIN pitch detector */
function yin(buf,sr){
  const W=Math.floor(buf.length/2);
  const tMin=Math.floor(sr/1500), tMax=Math.min(W-1,Math.floor(sr/75));
  const d=new Float32Array(tMax+1);
  for(let tau=1;tau<=tMax;tau++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];s+=x*x;}d[tau]=s;}
  d[0]=1; let run=0;
  for(let tau=1;tau<=tMax;tau++){run+=d[tau]; d[tau]=run?d[tau]*tau/run:1;}
  let tau=-1;
  for(let t=tMin;t<=tMax;t++){ if(d[t]<0.15){ while(t+1<=tMax&&d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<0) return null;
  let better=tau;
  if(tau>1&&tau<tMax){const s0=d[tau-1],s1=d[tau],s2=d[tau+1],den=2*(2*s1-s2-s0); if(den) better=tau+(s2-s0)/den;}
  return {freq:sr/better,clarity:1-d[tau]};
}

let hist=[],cand=null,lastEmit={t:0,pc:-1},stable={midi:null,n:0},noiseFloor=0.003,frame=0,heardClear=0;
function loop(){
  requestAnimationFrame(loop);
  if(mic.state!=='on') return;
  if((frame++)%2) return;
  const now=performance.now();
  mic.an.getFloatTimeDomainData(mic.buf);
  mic.ri=(mic.ri+1)%mic.ring.length; mic.fan.getFloatFrequencyData(mic.ring[mic.ri]);
  let s=0; for(let i=0;i<mic.buf.length;i++) s+=mic.buf[i]*mic.buf[i];
  const rms=Math.sqrt(s/mic.buf.length);
  meter(rms);
  noiseFloor = rms<noiseFloor ? noiseFloor*0.85+rms*0.15 : noiseFloor*0.997+rms*0.003;
  const gate=Math.max(0.006*SENS[sens], noiseFloor*3);
  if(now<muteUntil){hist=[];cand=null;stable={midi:null,n:0};return;}
  hist.push(rms); if(hist.length>6) hist.shift();
  let p=null;
  if(rms>gate){
    const r=yin(mic.buf,mic.sr);
    if(r&&r.clarity>0.85&&r.freq>70&&r.freq<1400) p=Math.round(69+12*Math.log2(r.freq/440));
  }
  if(p!=null){ $('#heard').textContent='I hear: '+nm(p); heardClear=now; }
  else if(now-heardClear>700) $('#heard').textContent='Listening…';
  const prev=hist.slice(0,-1);
  const onset=prev.length>=2 && rms>gate && rms>Math.min(...prev)*1.5 && now-lastEmit.t>130;
  if(onset&&!cand) cand={t:now-25,votes:{},before:mic.ring[(mic.ri+mic.ring.length-2)%mic.ring.length].slice()};
  if(cand){
    if(p!=null) cand.votes[p]=(cand.votes[p]||0)+1;
    if(now-cand.t>100){
      let best=null,bn=0; for(const k in cand.votes) if(cand.votes[k]>bn){bn=cand.votes[k];best=+k;}
      const c0t=cand.t, spec={before:cand.before,after:mic.ring[mic.ri].slice(),sr:mic.sr,fft:mic.fan.fftSize}; cand=null;
      if(best!=null&&bn>=2){emit(best,'mic',c0t,'onset',spec); stable={midi:best,n:0,t0:c0t};}
      else if(handler&&handler.wantsChords) emit(null,'mic',c0t,'onset',spec);
    }
  }else{
    if(p!=null){
      if(stable.midi===p) stable.n++; else stable={midi:p,n:1,t0:now};
      if(stable.n===4&&pcOf(p)!==lastEmit.pc&&now-lastEmit.t>200) emit(p,'mic',stable.t0,'legato');
    }else stable={midi:null,n:0};
  }
}
requestAnimationFrame(loop);
function meter(rms){ $('#meter i').style.width=Math.min(100,Math.sqrt(rms)*260)+'%'; }

let handler=null;
function emit(midi,source,t,path,spec){
  const now=performance.now(); t=t||now;
  if(midi==null){ // a struck sound with no single clear pitch: only chord listeners care
    if(synthLog.some(e=>Math.abs(t-e.start)<180)) return;
    if(handler&&handler.wantsChords) handler({midi:null,pc:null,source,t,path,spec});
    return;
  }
  lastEmit={t:now,pc:pcOf(midi)};
  const bleed=source==='mic'?bleedOf(pcOf(midi),t):null;
  // the mic overheard my own left-hand playing: ignore it quietly
  if(bleed==='onset'||(bleed==='sustain'&&path==='legato')) return;
  kb.flash(midi);
  if(handler) handler({midi,pc:pcOf(midi),source,t,path:path||'tap',spec});
}
/* ---- expected-note checker: are these exact notes sounding, and were they just struck? ---- */
function noteLevel(db,m,sr,fft,c){
  const f=440*Math.pow(2,(m-69)/12), bh=sr/fft;
  const lo=Math.round(f*Math.pow(2,-c/12)/bh), hi=Math.round(f*Math.pow(2,c/12)/bh);
  let mx=-300; for(let i=lo;i<=hi&&i<db.length;i++){const v=db[i]>-300?db[i]:-300; if(v>mx) mx=v;} return mx;
}
function checkNotes(spec,midis){
  const {before,after,sr,fft}=spec; const L={},Nn={},lv=[];
  for(let m=45;m<100;m++){L[m]=noteLevel(after,m,sr,fft,0.3);Nn[m]=noteLevel(after,m,sr,fft,0.1);lv.push(L[m]);}
  lv.sort((a,b)=>a-b); const floor=lv[lv.length>>1];
  const tryShift=sh=>{ const tg=midis.map(m=>m+sh); const present=[],missing=[];
    tg.forEach((m,i)=>{ if(m<46||m>98){missing.push(midis[i]);return;}
      const nb=[m-1,m+1].filter(x=>!tg.includes(x)).map(x=>Nn[x]);
      const contrast=nb.length?L[m]-Math.max(...nb):99;
      const b=noteLevel(before,m,sr,fft,0.3), rise=L[m]-b, bfl=b-floor;
      ((L[m]-floor>12)&&contrast>3&&(rise>1.5||bfl<12)?present:missing).push(midis[i]); });
    return {present,missing}; };
  let best=null; for(const sh of [0,-12])  /* never check an octave up: a lower note's overtones live there */{ const r=tryShift(sh); if(!best||r.present.length>best.present.length) best=r; if(!r.missing.length) break; }
  return best;
}
const asArr=x=>Array.isArray(x)?x:[x];
const lbl=x=>asArr(x).map(nm).join('‑');

/* judge one played event against an expected note or chord */
function judge(ev,target,taps){
  const tg=asArr(target);
  if(tg.length===1){ if(ev.midi==null) return {kind:'ignore'}; return ev.pc===pcOf(tg[0])?{kind:'hit',t:ev.t}:{kind:'wrong'}; }
  if(ev.source==='tap'){
    if(!tg.some(m=>pcOf(m)===ev.pc)) return {kind:'wrong'};
    taps.list=(taps.list||[]).filter(x=>ev.t-x.t<800); taps.list.push({pc:ev.pc,t:ev.t});
    const got=new Set(taps.list.map(x=>x.pc)); const missing=tg.filter(m=>!got.has(pcOf(m)));
    if(missing.length) return {kind:'partial',present:tg.filter(m=>got.has(pcOf(m))),missing,quiet:true};
    const t0=taps.list[0].t; taps.list=[]; return {kind:'hit',t:t0};
  }
  if(!ev.spec) return {kind:'ignore'};
  const r=checkNotes(ev.spec,tg);
  if(!r.missing.length) return {kind:'hit',t:ev.t};
  if(!r.present.length) return ev.midi==null?{kind:'ignore'}:{kind:'wrong'};
  return {kind:'partial',present:r.present,missing:r.missing};
}

/* ---------- on-screen keyboard ---------- */
let KB_LO=48, KB_HI=72;
const kb={
  keys:{},
  build(lo=48,hi=72){
    if(this.built&&lo===KB_LO&&hi===KB_HI) return;
    KB_LO=lo; KB_HI=hi; this.keys={};
    const el=$('#kb'); el.innerHTML='';
    const whites=[]; for(let m=KB_LO;m<=KB_HI;m++) if(!isBlack(m)) whites.push(m);
    const n=whites.length, bw=0.62/n*100;
    for(let m=KB_LO;m<=KB_HI;m++){
      const k=document.createElement('div'); k.dataset.midi=m;
      if(isBlack(m)){
        k.className='key b';
        const wi=whites.indexOf(m-1);
        k.style.left=((wi+1)/n*100-bw/2)+'%'; k.style.width=bw+'%';
      }else{
        k.className='key w';
        k.innerHTML=`<span class="fing"></span><span class="lbl">${nm(m)}</span>`+(m===60?'<span class="dot"></span>':'');
      }
      el.appendChild(k); this.keys[m]=k;
    }
    if(this.built){this.built=true;return;} this.built=true;
    el.addEventListener('pointerdown',e=>{
      const k=e.target.closest('.key'); if(!k) return; e.preventDefault();
      const m=+k.dataset.midi;
      tone(m,0,0.8);
      if(mic.state!=='on'&&mic.state!=='tap'){mic.state='tap';setStatus();}
      emit(m,'tap');
    });
  },
  inRange(m){while(m<KB_LO)m+=12;while(m>KB_HI)m-=12;return m;},
  fit(ms){ // show about two octaves that cover these notes
    const mn=Math.min(...ms), mx=Math.max(...ms); let lo=mn-pcOf(mn); if(lo>60&&mx-lo<=19) lo-=12;
    let hi=Math.max(lo+24,mx); while(isBlack(hi)) hi++; lo=Math.min(lo,60); if(hi-lo>28) lo=mn-pcOf(mn);
    this.build(lo,hi); },
  clear(){for(const m in this.keys){this.keys[m].classList.remove('hl','hl2','hint');const f=this.keys[m].querySelector('.fing');if(f)f.textContent='';}},
  hl(ms,cls='hl'){(ms||[]).forEach(m=>{const k=this.keys[m];if(k)k.classList.add(cls);});},
  unhint(){for(const m in this.keys)this.keys[m].classList.remove('hint');},
  fingers(map){for(const m in map){const k=this.keys[m];if(k){const f=k.querySelector('.fing');if(f)f.textContent=map[m];}}},
  flash(m){const k=this.keys[this.inRange(m)]; if(!k) return; k.classList.add('press'); clearTimeout(k._t); k._t=setTimeout(()=>k.classList.remove('press'),350);}
};

/* ---------- staff drawing ---------- */
function diat(m){return (Math.floor(m/12)-1)*7+LETTER[pcOf(m)];}
function staffSVG(items,o={}){
  const x0=62;
  const notes=items.filter(i=>!i.bar);
  const hasLyr=notes.some(i=>i.lyric), hasFg=notes.some(i=>i.finger), hasNm=notes.some(i=>i.name), hasTag=o.tags;
  const top=24,gap=12,bot=top+4*gap;
  let y=bot+30; const yNm=y; if(hasNm) y+=16; const yFg=y; if(hasFg) y+=15; const yLy=y+2; if(hasLyr) y+=18; const yTg=y-2; if(hasTag) y+=12;
  const H=Math.max(y,bot+26);
  const ny=pos=>bot-pos*6;
  let x=x0; const xs=[];
  items.forEach(it=>{ if(it.bar){xs.push(x+2);x+=12;} else {const w=it.w||o.spacing||44; xs.push(x+w/2-6); x+=w;} });
  const W=Math.max(o.minW||240,x+12);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="max-width:${W*1.15}px" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<5;i++) s+=`<line class="staffline" x1="4" x2="${W-4}" y1="${top+i*gap}" y2="${top+i*gap}"/>`;
  s+=`<text class="clef" x="8" y="${bot+11}" font-size="62">𝄞</text>`;
  items.forEach((it,i)=>{
    const cx=xs[i];
    if(it.bar){ s+=`<line class="staffline" x1="${cx}" x2="${cx}" y1="${top}" y2="${bot}" style="stroke-width:${it.final?3:1.2}"/>`; return; }
    const ps=(Array.isArray(it.midi)?it.midi:[it.midi]).map(m=>diat(m)-30).sort((a,b)=>a-b);
    const lowP=ps[0], highP=ps[ps.length-1], up=(lowP+highP)/2<4;
    const pos=up?lowP:highP, cy=ny(pos), d=it.d||1, hol=d>=2, whole=d>=4;
    s+=`<g class="${it.cls||''}">`;
    if(lowP<=-2) for(let p=-2;p>=lowP;p-=2) s+=`<line class="staffline" x1="${cx-12}" x2="${cx+12}" y1="${ny(p)}" y2="${ny(p)}"/>`;
    if(highP>=10) for(let p=10;p<=highP;p+=2) s+=`<line class="staffline" x1="${cx-12}" x2="${cx+12}" y1="${ny(p)}" y2="${ny(p)}"/>`;
    ps.forEach((p,k)=>{ const hx=(k>0&&p-ps[k-1]===1&&!(k>1&&ps[k-1]-ps[k-2]===1))?cx+12:cx, hy=ny(p);
      s+=`<ellipse class="nh${hol?' hol':''}" cx="${hx}" cy="${hy}" rx="${whole?8:7}" ry="${whole?5.6:5.2}" transform="rotate(${whole?-12:-20} ${hx} ${hy})"/>`; });
    if(!whole){
      const far=ny(up?highP:lowP), sx=up?cx+6.3:cx-6.3, sy=up?far-34:far+34;
      s+=`<line class="stem" x1="${sx}" x2="${sx}" y1="${up?cy-1:cy+1}" y2="${sy}"/>`;
      if(d<=0.5) s+=up?`<path class="flag" d="M${sx} ${sy} c0 7 9 9 8 18"/>`:`<path class="flag" d="M${sx} ${sy} c0 -7 9 -9 8 -18"/>`;
    }
    if(it.cls==='n-cur') s+=`<path class="mark" d="M${cx-5} 4 L${cx+5} 4 L${cx} 11 Z"/>`;
    if(it.name) s+=`<text class="lab nm" x="${cx}" y="${yNm}"${String(it.name).length>3?' style="font-size:10px"':''}>${it.name}</text>`;
    if(it.finger) s+=`<text class="lab fg" x="${cx}" y="${yFg}">${it.finger}</text>`;
    if(it.lyric) s+=`<text class="lab" x="${cx}" y="${yLy}">${it.lyric}</text>`;
    if(it.tag) s+=`<text class="lab tg" x="${cx}" y="${yTg}">${it.tag}</text>`;
    s+='</g>';
  });
  return s+'</svg>';
}

     <div class="num">${done.includes(i)?'✓':i+1}</div><div><b>${L.title}</b><span>${L.mins} min${i===next?' · up next':''}</span></div></button>`).join('')}</div>`;
  screen.querySelectorAll('.lesson[data-i]').forEach(b=>b.onclick=()=>go(+b.dataset.i,0));
  screen.querySelectorAll('.lesson[data-ex]').forEach(b=>b.onclick=()=>openEx(+b.dataset.ex,{}));
  $('#daily').onclick=startDaily;
  $('#dKeys').onclick=()=>keyDrill(8,null);
  $('#dCards').onclick=()=>cardDrill(10,null);
  $('#main').scrollTop=0;
}
$('#hdrBack').onclick=home;

function go(l,s){
  stopRun(); kb.build(48,72); $('#kb').classList.remove('hide-labels');
  cur={l,s}; handler=null; kb.clear(); kb.unhint();
  const L=LESSONS[l], st=L.steps[s];
  $('#hdrBack').style.display=''; $('#hdrTitle').textContent=L.title;
  if(st.kb){kb.hl(st.kb.hl,'hl');kb.hl(st.kb.hl2,'hl2');if(st.kb.fingers)kb.fingers(st.kb.fingers);}
  const prog=`<div class="progress">${L.steps.map((_,i)=>`<i class="${i<=s?'d':''}"></i>`).join('')}</div>`;
  ({info:rInfo,mic:rMic,play:rPlay,seq:rSeq,quiz:rQuiz,done:rDone})[st.type](st,prog);
  $('#main').scrollTop=0;
}
const next=()=>{const L=LESSONS[cur.l]; if(cur.s+1<L.steps.length) go(cur.l,cur.s+1); else home();};
const backLink=()=>cur.s>0?'<button class="link" id="prev">‹ Back</button>':'';
function wire(){const p=$('#prev');if(p)p.onclick=()=>go(cur.l,cur.s-1);}

function rInfo(st,prog){
  let staff='';
  if(st.staff) staff=`<div class="staffbox">${staffSVG(st.staff.map(m=>({midi:m,name:st.staffNames?nm(m):''})),{minW:260})}</div>`;
  screen.innerHTML=`<div class="card">${prog}<h2>${st.title||''}</h2><div class="txt">${st.text}</div>${staff}
    <div class="row">${st.demo?'<button class="ghost" id="demo">▶ Hear it</button>':''}<button class="primary" id="nx">${st.btn||'Next'}</button></div>${backLink()}</div>`;
  $('#nx').onclick=next; wire();
  if(st.demo) $('#demo').onclick=()=>playSeq(st.demo);
}

function rMic(st,prog){
  const draw=()=>{
    let body,btns='';
    if(mic.state==='on'){body='<p>I\'m listening. <b>Play any key</b> on your piano, nice and gentle, to say hello.</p>';}
    else if(mic.state==='denied'){body=`<p>${micBlockedText()}</p><p><b>Tap any key below</b> to say hello.</p>`;btns='<button class="ghost" id="mOn">Try the mic again</button>';}
    else if(mic.state==='tap'){body='<p>No problem. <b>Tap any key below</b> to say hello. You can turn on listening later from the button at the top.</p>';}
    else{body='<p>I can listen to your real piano through your phone\'s microphone. Your phone will ask for permission. The sound stays on your phone.</p>';
         btns='<button class="primary" id="mOn">🎤 Turn on listening</button><button class="ghost" id="mTap">I\'ll tap the screen</button>';}
    screen.innerHTML=`<div class="card">${prog}<h2>Can I listen?</h2><div class="txt">${body}</div><div class="fb" id="fb">${mic.state==='on'||mic.state==='tap'||mic.state==='denied'?'Waiting for a note…':''}</div>
      <div class="row">${btns}<button class="primary" id="nx" style="display:none">Next</button></div>${backLink()}</div>`;
    const on=$('#mOn'); if(on) on.onclick=async()=>{await startMic(); draw();};
    const tp=$('#mTap'); if(tp) tp.onclick=()=>{mic.state='tap'; setStatus(); draw();};
    $('#nx').onclick=next; wire();
  };
  draw();
  handler=ev=>{
    const fb=$('#fb'); fb.className='fb good';
    fb.innerHTML=ev.source==='mic'?`I heard <b>${nm(ev.midi)}</b>. We're connected! 🎹`:`That was <b>${nm(ev.midi)}</b>. We're all set! 🎹`;
    $('#nx').style.display=''; const on=$('#mOn'); if(on&&mic.state==='on') on.remove();
  };
}

function dirHint(target,ev){
  let d=(((target-ev.pc)%12)+12)%12; if(d>6) d-=12;
  return d>0?'Try a little to the <b>right</b>.':'Try a little to the <b>left</b>.';
}

function rPlay(st,prog){
  let misses=0;
  const staff=st.staff!=null?`<div class="staffbox" style="max-width:240px">${staffSVG([{midi:st.staff,name:st.showName?nm(st.staff):''}],{minW:150})}</div>`:'';
  screen.innerHTML=`<div class="card">${prog}<p class="prompt">${st.prompt}</p>${staff}
    <div class="fb" id="fb">${mic.state==='on'?'Listening…':'Play it on your piano, or tap the key below.'}</div>
    <div class="row"><button class="ghost" id="hear">🔈 How does it sound?</button><button class="link" id="skip" style="display:none">Skip this one</button></div>${backLink()}</div>`;
  wire();
  $('#hear').onclick=()=>tone(st.hint[0],0,0.9);
  $('#skip').onclick=next;
  handler=ev=>{
    const fb=$('#fb');
    if(st.accept.includes(ev.pc)){
      handler=null; kb.unhint(); fb.className='fb good';
      fb.innerHTML=`<b>${pick(PRAISE)}</b> ${st.ok||('That\'s '+nm(ev.midi)+'.')}`;
      setTimeout(()=>{if(cur.l===curL&&cur.s===curS) next();},1400);
    }else{
      misses++; fb.className='fb miss';
      const heard=`That was <b>${nm(ev.midi)}</b>.`;
      if(misses===1) fb.innerHTML=`${heard} ${st.missHint||(st.accept.length===1?dirHint(st.accept[0],ev):'Almost!')}`;
      else if(misses===2){fb.innerHTML=`${heard} Close! I lit up the key for you below.`;kb.hl(st.hint,'hint');}
      else {fb.innerHTML=`No rush at all. Match the glowing key, or skip this one. That's fine too.`;kb.hl(st.hint,'hint');$('#skip').style.display='';}
    }
  };
  const curL=cur.l,curS=cur.s;
}

function rSeq(st,prog){
  const phrases=st.phrases||[st.notes], notes=flat(phrases);
  let idx=0, misses=0, guide=!!st.guide;
  screen.innerHTML=`<div class="card">${prog}<p class="prompt">${st.prompt}</p><div id="disp"></div>
    <div class="fb" id="fb">${mic.state==='on'?'Listening… start whenever you\'re ready.':'Play on your piano, or tap the keys below.'}</div>
    <div class="row" id="ctl">${st.demo?'<button class="ghost" id="demo">▶ Hear it</button>':''}<button class="ghost ${guide?'on':''}" id="guide">💡 Light up the keys</button><button class="link" id="skip" style="display:none">Skip this note</button></div>
    <div class="row" id="fin" style="display:none"><button class="ghost" id="again">↺ Play it again</button><button class="primary" id="nx">Next</button></div>${backLink()}</div>`;
  wire();
  const draw=()=>{
    const d=$('#disp');
    if(st.view==='staff'){
      let g=0; const maxW=62+Math.max(...phrases.map(ph=>ph.length))*42+12;
      d.innerHTML=phrases.map((ph,pi)=>`<div class="staffbox" data-p="${pi}">${staffSVG(ph.map((m,j)=>{const i=g++;return{midi:m,name:nm(m),finger:st.fingers?CPOS[pcOf(m)]:'',lyric:st.lyrics?st.lyrics[pi][j]:'',cls:i<idx?'n-done':i===idx?'n-cur':''};}),{spacing:42,minW:maxW})}</div>`).join('');
      let acc=0,pcur=0; phrases.forEach((ph,pi)=>{if(idx>=acc&&idx<acc+ph.length)pcur=pi;acc+=ph.length;});
      const box=d.querySelector(`[data-p="${pcur}"]`); if(box&&idx>0) box.scrollIntoView({block:'nearest',behavior:'smooth'});
    }else{
      d.innerHTML=`<div class="chips">${notes.map((m,i)=>`<div class="chip ${i<idx?'done':i===idx?'cur':''}">${nm(m)}${st.fingers?`<small>${CPOS[pcOf(m)]}</small>`:''}</div>`).join('')}</div>`;
    }
    kb.unhint(); if(guide&&idx<notes.length) kb.hl([notes[idx]],'hint');
  };
  draw();
  $('#guide').onclick=e=>{guide=!guide;e.currentTarget.classList.toggle('on',guide);draw();};
  if(st.demo) $('#demo').onclick=()=>playSeq(notes);
  const advance=()=>{
    idx++; misses=0; $('#skip').style.display='none';
    if(idx>=notes.length){
      draw(); handler=null; kb.unhint();
      const fb=$('#fb'); fb.className='fb good'; fb.innerHTML=`<b>${st.done||'Done!'}</b>`;
      $('#ctl').style.display='none'; $('#fin').style.display='';
      setTimeout(()=>$('#fin').scrollIntoView({block:'nearest',behavior:'smooth'}),50);
    }else draw();
  };
  $('#skip').onclick=()=>{$('#fb').className='fb';$('#fb').innerHTML='Skipped. On to the next one.';advance();};
  $('#again').onclick=()=>go(cur.l,cur.s);
  $('#nx').onclick=next;
  handler=ev=>{
    const fb=$('#fb'), target=notes[idx];
    if(ev.pc===pcOf(target)){
      fb.className='fb good';
      fb.innerHTML=idx+1<notes.length?`<b>${nm(target)}</b> ✓ ${idx%3===2?pick(PRAISE):''}`:'';
      advance();
    }else{
      misses++; fb.className='fb miss';
      const want=`We're looking for <b>${nm(target)}</b>.`;
      if(misses===1) fb.innerHTML=`That was ${nm(ev.midi)}. ${want} ${dirHint(pcOf(target),ev)}`;
      else {fb.innerHTML=`${want} I lit it up for you. You're doing fine.`; kb.hl([target],'hint');}
      if(misses>=3) $('#skip').style.display='';
    }
  };
}

function rQuiz(st,prog){
  const qs=[]; let last=null;
  for(let i=0;i<st.n;i++){let m;do{m=pick(st.pool);}while(m===last);qs.push(m);last=m;}
  let q=0, misses=0;
  const curL=cur.l,curS=cur.s;
  const draw=(revealed)=>{
    const m=qs[q];
    screen.innerHTML=`<div class="card">${prog}<p class="prompt">What note is this? <b>Play it.</b></p>
      <div class="chips">${qs.map((_,i)=>`<div class="chip ${i<q?'done':i===q?'cur':''}" style="min-width:28px;padding:4px;font-size:13px">${i<q?'✓':i+1}</div>`).join('')}</div>
      <div class="staffbox" style="max-width:240px">${staffSVG([{midi:m,name:revealed?nm(m):''}],{minW:150})}</div>
      <div class="fb" id="fb">Take your time.</div>
      <div class="row"><button class="link" id="skip" style="display:none">Skip this one</button></div>${backLink()}</div>`;
    wire(); $('#skip').onclick=nextQ;
  };
  const nextQ=()=>{kb.unhint(); q++; misses=0; if(q>=qs.length) next(); else draw(false);};
  draw(false);
  handler=ev=>{
    if(cur.l!==curL||cur.s!==curS) return;
    const m=qs[q], fb=$('#fb');
    if(ev.pc===pcOf(m)){
      fb.className='fb good'; fb.innerHTML=`<b>${pick(PRAISE)}</b> That's ${nm(m)}.`;
      const qq=q; setTimeout(()=>{if(q===qq&&cur.l===curL&&cur.s===curS) nextQ();},1100);
    }else{
      misses++;
      if(misses===1){fb.className='fb miss';fb.innerHTML=`That was ${nm(ev.midi)}. Count up from middle C: line, space, line… ${dirHint(pcOf(m),ev)}`;}
      else{draw(true); const f=$('#fb'); f.className='fb miss'; f.innerHTML=`Here's a hint: it's <b>${nm(m)}</b>, glowing below.`; kb.hl([m],'hint'); if(misses>=3) $('#skip').style.display='';}
    }
  };
}

function rDone(st,prog){
  const L=LESSONS[cur.l];
  if(!done.includes(cur.l)){done.push(cur.l);store.set('done',done);}
  const hasNext=cur.l+1<LESSONS.length;
  screen.innerHTML=`<div class="card">${prog}<div class="big">🌟</div><h2 style="text-align:center">Lesson complete</h2>
    <div class="txt" style="text-align:center"><p>${L.doneText}</p></div>
    <div class="row" style="justify-content:center">${hasNext?`<button class="primary" id="nl">Next: ${LESSONS[cur.l+1].title}</button>`:''}<button class="ghost" id="hm">All lessons</button></div></div>`;
  if(hasNext) $('#nl').onclick=()=>go(cur.l+1,0);
  $('#hm').onclick=home;
}

const TEACHER='Fräulein Czerny';
const say=html=>`<div class="anna"><div class="av">AC</div><div class="bubble"><div class="who">${TEACHER}</div>${html}</div></div>`;
const DANKE=['Sehr gut!','Wunderbar.','Ja, genau!','Carl would nod. He rarely smiled.','Schön.','Exactly so.','Bravo.'];
let run=null, daily=null;
function stopRun(){ if(!run) return; try{run.bus.disconnect();}catch(e){} (run.timers||[]).forEach(clearTimeout); cancelAnimationFrame(run.raf); run=null; }
function newBus(){ const c=ac(), g=c.createGain(); g.connect(c.destination); return g; }
function dayStr(off=0){const d=new Date(Date.now()+off*864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function streakInfo(){
  const s=store.get('streak',{last:null,n:0}), today=s.last===dayStr(), yest=s.last===dayStr(-1);
  let line;
  if(!s.last) line=`<p>Guten Tag! I'm Anna, Carl Czerny's older sister. Yes, that Carl, Beethoven's pupil.</p><p>I've borrowed his exercises and travelled rather far to bring them to you. I kept what he got right and changed what I think he'd approve of: no scolding, short sessions, and a little machine that keeps the beat.</p>`;
  else if(today) line=`<p>You've practiced today. Day ${s.n}! Anything more is a gift.</p>`;
  else if(yest) line=`<p>Willkommen zurück! You're on day ${s.n}. Shall we make it ${s.n+1}?</p>`;
  else line=`<p>There you are! Pianos are patient, and so am I. Let's pick up where we left off.</p>`;
  return {today,line,n:s.n};
}
function bumpStreak(){
  const s=store.get('streak',{last:null,n:0});
  if(s.last===dayStr()) return s.n;
  s.n=(s.last===dayStr(-1))?s.n+1:1; s.last=dayStr(); store.set('streak',s); return s.n;
}
const WSTEP={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function thumbNote(e){ const n=e.rh.find(n=>n[3]); if(!n) return asArr(e.rh[0][2])[0];
  // walk down white keys from the lowest fingered note to where the thumb rests
  const ms=asArr(n[2]), fs=asArr(n[3]); const k=ms.indexOf(Math.min(...ms));
  let m=ms[k], f=fs[k]||1; while(f>1){ m--; while(isBlack(m)) m--; f--; } return m; }
function posLabel(e){ return `thumb on ${nm(thumbNote(e))}`; }
function currentEx(){ const st=store.get('ex',{}); const ok=EX.filter(e=>!e.skip);
  return ok.find(e=>!((st[e.no]||{}).best>=0.8)) || ok[Math.floor(Math.random()*ok.length)]; }
function practiceHeader(title){ stopRun(); handler=null; kb.build(48,72); kb.clear(); kb.unhint(); $('#kb').classList.remove('hide-labels');
  $('#hdrBack').style.display=''; $('#hdrTitle').textContent=title; $('#main').scrollTop=0; }

/* ---- daily session ---- */
function startDaily(){
  daily={step:0};
  const steps=[
    ()=>keyDrill(6,dailyNext),
    ()=>cardDrill(8,dailyNext),
    ()=>{const e=currentEx(); const st=store.get('ex',{})[e.no]||{}; openEx(e.no,{mode:st.learned?'time':'learn',onDone:dailyNext});},
    ()=>dailyEnd()
  ];
  daily.steps=steps; steps[0]();
}
function dailyNext(){ if(!daily) return home(); daily.step++; daily.steps[daily.step](); }
function dailyEnd(){
  const n=bumpStreak(); daily=null; practiceHeader('Practice');
  const tips=['Carl\'s rule: a <b>quiet hand</b>. Your hand stays still like a sleeping cat, and only the fingers move.',
    'Beethoven was one of the first composers to write metronome marks in his music. So the click is respectable.',
    'Short and often beats long and rare. Carl practiced for hours, but he was a little strange.',
    'If you have a minute later, play today\'s exercise once more, slowly, without me listening.'];
  screen.innerHTML=`<div class="card"><div class="big">🎹</div>${say(`<p><b>That's day ${n}.</b> ${pick(DANKE)}</p><p>${pick(tips)}</p>`)}
    <div class="row"><button class="primary" id="hm">Back to the music room</button></div></div>`;
  $('#hm').onclick=home;
}

    else { misses++; fb.className='fb miss';
      if(misses===1) fb.innerHTML=`That was ${nm(ev.midi)}. ${NAMES[t]} is ${LANDMARK[t]}.`;
      else { fb.innerHTML=`Here, I've lit them up for you.`; $('#kb').classList.remove('hide-labels'); kb.hl(Object.keys(kb.keys).map(Number).filter(m=>pcOf(m)===t),'hint'); if(misses>=3) $('#skip').style.display=''; }
    }};
  const h=handler;
}

/* ---- drill: knowledge of the notes (spaced repetition) ---- */
const CARD_SEQ=[60,62,64,65,67,69,71,72,74,76,77,79];
const WHERE={60:'below the staff, on its own little line',62:'just under the bottom line',64:'on the bottom line',65:'in the first space',67:'on the second line',69:'in the second space',71:'on the middle line',72:'in the third space',74:'on the fourth line',76:'in the top space',77:'on the top line',79:'just above the top line'};
function cardDrill(n,onDone){
  practiceHeader('Knowledge of the notes');
  const boxes=store.get('cards',{}); let unlocked=store.get('unlocked',5);
  CARD_SEQ.slice(0,unlocked).forEach(m=>{if(boxes[m]==null) boxes[m]=2;});
  let fresh=null;
  if(unlocked<CARD_SEQ.length && CARD_SEQ.slice(0,unlocked).every(m=>boxes[m]>=3)){
    fresh=CARD_SEQ[unlocked]; unlocked++; boxes[fresh]=1; store.set('unlocked',unlocked);
  }
  store.set('cards',boxes);
  const pool=CARD_SEQ.slice(0,unlocked);
  const pickCard=prev=>{ let tot=0; const w=pool.map(m=>{const x=m===prev?0:1/Math.pow(2,(boxes[m]||1)-1);tot+=x;return x;});
    let r=Math.random()*tot; for(let i=0;i<pool.length;i++){r-=w[i]; if(r<=0) return pool[i];} return pool[0]; };
  const qs=[]; let prev=null; if(fresh){qs.push(fresh);prev=fresh;}
  while(qs.length<n){const m=pickCard(prev);qs.push(m);prev=m;}
  let q=0,misses=0,first=0; const myRun={timers:[]}; run=myRun;
  const draw=(reveal)=>{ const m=qs[q];
    screen.innerHTML=`<div class="card">${q===0&&fresh?say(`<p>A new note joins us: <b>${nm(fresh)}</b>, ${WHERE[fresh]}.</p>`):q===0?say('<p>Carl began his book with knowledge of the notes, and so shall we. Read it, then play it.</p>'):''}
      <div class="chips">${qs.map((_,i)=>`<div class="chip ${i<q?'done':i===q?'cur':''}" style="min-width:28px;padding:4px;font-size:13px">${i<q?'✓':i+1}</div>`).join('')}</div>
      <div class="staffbox" style="max-width:240px">${staffSVG([{midi:m,name:(reveal||(fresh&&q===0))?nm(m):''}],{minW:150})}</div>
      <div class="fb" id="fb">${fresh&&q===0?'Play the new note.':'What note is this? Play it.'}</div>
      <div class="row"><button class="link" id="skip" style="display:none">Skip this one</button></div></div>`;
    $('#skip').onclick=nextQ; };
  const nextQ=()=>{kb.unhint();q++;misses=0;if(q>=qs.length) finish(); else draw(false);};
  const finish=()=>{handler=null; store.set('cards',boxes);
    const strong=pool.filter(m=>boxes[m]>=3).length;
    screen.innerHTML=`<div class="card">${say(`<p>${first} of ${qs.length} on the first try. You know ${strong} of your ${pool.length} notes by sight.</p><p>${strong===pool.length&&unlocked<CARD_SEQ.length?'Next time, a new note joins the deck.':'The ones you missed will come back a little more often. That\'s how they stick.'}</p>`)}
      <div class="row"><button class="primary" id="nx">${onDone?'Next: Carl\'s exercise':'Done'}</button><button class="ghost" id="again">Again</button></div></div>`;
    $('#nx').onclick=onDone||home; $('#again').onclick=()=>cardDrill(n,onDone);};
  draw(false);
  const h=ev=>{ if(run!==myRun) return; const m=qs[q], fb=$('#fb');
    if(ev.pc===pcOf(m)){ if(!misses){first++;boxes[m]=Math.min(5,(boxes[m]||1)+1);} fb.className='fb good'; fb.innerHTML=`<b>${pick(PRAISE)}</b> That's ${nm(m)}.`;
      handler=null; myRun.timers.push(setTimeout(()=>{if(run===myRun){handler=h;nextQ();}},900)); }
    else { misses++; boxes[m]=1;
      if(misses===1){fb.className='fb miss';fb.innerHTML=`That was ${nm(ev.midi)}. Find a landmark: middle C sits below the staff, G is on the second line. Count up or down from there.`;}
      else {draw(true); const f=$('#fb'); f.className='fb miss'; f.innerHTML=`It's <b>${nm(m)}</b>, ${WHERE[m]}. It's glowing below.`; kb.hl([m],'hint'); if(misses>=3) $('#skip').style.display='';}
    }};
  handler=h;
}

/* ---- Carl's exercises: learn the notes, then play in time ---- */
const TEMPI={slow:50,steady:66,brisk:88};
function systemsOf(e){ // group bars into lines that fit a phone screen
  const bars=[]; for(let b=0;b<e.total/4;b++) bars.push([]);
  e.rh.forEach((n,i)=>bars[Math.floor(n[0]/4+1e-6)].push(i));
  const sys=[]; let curS=[];let wid=0;
  const bw=b=>b.reduce((x,i)=>x+28+7*e.rh[i][1],0)+12;
  bars.forEach(b=>{ if(wid&&wid+bw(b)>330){sys.push(curS);curS=[];wid=0;} curS.push(b); wid+=bw(b); });
  if(curS.length) sys.push(curS); return sys;
}
function exStaff(e,cls,opts){
  const sys=systemsOf(e);
  const W=Math.max(...sys.map(bs=>62+bs.reduce((a,b)=>a+b.reduce((x,i)=>x+28+7*e.rh[i][1],0)+12,0)+12));
  return sys.map((bs,si)=>{ const items=[];
    bs.forEach((b,bi)=>{ b.forEach(i=>{const n=e.rh[i]; items.push({midi:n[2],d:n[1],w:28+7*n[1],finger:opts.fingers?asArr(n[3]).join(''):'',name:opts.names?asArr(n[2]).map(nm).join(''):'',cls:cls(i),tag:opts.tag?opts.tag(i):''});});
      items.push({bar:true,final:si===sys.length-1&&bi===bs.length-1}); });
    return `<div class="staffbox" data-s="${si}">${staffSVG(items,{minW:W,tags:!!opts.tag})}</div>`; }).join('');
}
function sysIndexOf(e,i){ const sys=systemsOf(e); for(let s=0;s<sys.length;s++) if(sys[s].some(b=>b.includes(i))) return s; return 0; }

function openEx(no,o){
  const e=EX.find(x=>x.no===no); const stAll=store.get('ex',{}); const st=stAll[no]||{};
  practiceHeader('Op. 599 No. '+no); kb.fit(e.rh.flatMap(n=>asArr(n[2])));
  const pref=store.get('exprefs',{names:true,accomp:true,tempo:'slow'});
  let mode=o.mode||(st.learned?'time':'learn');
  const intro=st.learned?`<p>No. ${no} again. ${pick(DANKE)}</p>`:
    `<p>Carl's No. ${no}. Right hand, <b>${posLabel(e)}</b>. The small numbers are his fingerings.</p>${e.chords?'<p>This one has <b>chords</b>, several notes struck together. Press them at the same moment, like one sound. I\'ll tell you if a note is missing.</p>':''}${e.shift?`<p>He wrote it ${e.shift===-12?'an octave':'two octaves'} higher up the piano. I've moved it to where you read. He'd forgive me.</p>`:''}${pref.accomp?'<p>I\'ll play his left-hand part, so we\'re a duet.</p>':''}`;
  screen.innerHTML=`<div class="card">${say(intro)}
    <div class="seg" id="mode"><button data-m="learn">Learn the notes</button><button data-m="time">Play in time</button></div>
    <div id="exbody"></div></div>`;
  const setMode=m=>{ mode=m; stopRun(); handler=null; kb.unhint(); screen.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); (m==='learn'?exLearn:exTime)(e,pref,o); };
  screen.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  setMode(mode);
}
function savePref(p){store.set('exprefs',p);}
function markEx(no,patch){ const all=store.get('ex',{}); all[no]=Object.assign(all[no]||{},patch); store.set('ex',all); }

function exLearn(e,pref,o){
  const body=$('#exbody'); let idx=0, misses=0; const myRun={timers:[]}; run=myRun;
  body.innerHTML=`<p class="prompt" style="font-size:17px">Play each note when you're ready. I'll wait for you${pref.accomp?' and answer with the left hand':''}.</p>
    <div class="opts"><button class="ghost ${pref.names?'on':''}" id="tNames">Note names</button><button class="ghost ${pref.accomp?'on':''}" id="tAcc">🎹 My left hand</button><button class="ghost" id="hear">▶ Hear it</button></div>
    <div id="disp"></div><div class="fb" id="fb">${mic.state==='on'?'Listening… begin whenever you like.':'Play on your piano, or tap the keys below.'}</div>
    <div class="row" id="fin" style="display:none"><button class="primary" id="nx">${o.onDone?'Finish today\'s practice':'Now play it in time'}</button><button class="ghost" id="again">Again</button></div>`;
  const draw=()=>{ $('#disp').innerHTML=exStaff(e,i=>i<idx?'n-done':i===idx?'n-cur':'',{fingers:true,names:pref.names});
    const box=$('#disp').querySelector(`[data-s="${sysIndexOf(e,idx)}"]`); if(box&&idx>0) box.scrollIntoView({block:'nearest',behavior:'smooth'}); };
  draw();
  $('#tNames').onclick=ev=>{pref.names=!pref.names;savePref(pref);ev.currentTarget.classList.toggle('on',pref.names);draw();};
  $('#tAcc').onclick=ev=>{pref.accomp=!pref.accomp;savePref(pref);ev.currentTarget.classList.toggle('on',pref.accomp);};
  $('#hear').onclick=()=>demoEx(e,TEMPI.steady,pref.accomp);
  $('#again').onclick=()=>exLearn(e,pref,o);
  $('#nx').onclick=()=>{ if(o.onDone) o.onDone(); else { screen.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m==='time')); exTime(e,pref,o);} };
  const answer=i=>{ if(!pref.accomp) return; const t0=e.rh[i][0], t1=i+1<e.rh.length?e.rh[i+1][0]:e.total, beat=0.6;
    if(!run.bus) run.bus=newBus();
    e.lh.filter(l=>l[0]>=t0&&l[0]<t1).forEach(l=>l[2].forEach(m=>tone(m,(l[0]-t0)*beat,Math.min(l[1],t1-l[0]+1)*beat,{vol:0.13,noMute:true,accomp:true,pure:true,dest:run.bus}))); };
  const taps={}; let lastHit=0;
  handler=ev=>{ if(run!==myRun||idx>=e.rh.length) return;
    const target=e.rh[idx][2], fb=$('#fb'), r=judge(ev,target,taps);
    if(r.kind==='ignore') return;
    if(r.kind!=='hit'&&ev.source==='mic'&&ev.t-lastHit<400) return; // echo of the chord just played
    if(r.kind==='partial'){
      fb.className='fb'+(r.quiet?'':' miss');
      fb.innerHTML=r.quiet?`${listNames(r.present)} ✓, now together with ${listNames(r.missing)}. (On screen, tap them all at once or quickly in a row.)`:`I heard ${listNames(r.present)}, but not ${listNames(r.missing)}. Press all ${asArr(target).length} at the same moment.`;
      if(!r.quiet){misses++; if(misses>=2) kb.hl(asArr(target),'hint');}
      return;
    }
    if(r.kind==='hit'){
      lastHit=ev.t; answer(idx); idx++; misses=0; kb.unhint(); fb.className='fb good';
      if(idx>=e.rh.length){ draw(); markEx(e.no,{learned:true}); fb.innerHTML=`<b>${pick(DANKE)}</b> You've learned No. ${e.no}. ${o.onDone?'':'Next, let\'s try it with the beat.'}`; $('#fin').style.display=''; setTimeout(()=>$('#fin').scrollIntoView({block:'nearest',behavior:'smooth'}),60); handler=null; }
      else { fb.innerHTML=`<b>${lbl(target)}</b> ✓`; draw(); }
    } else {
      misses++; fb.className='fb miss';
      const fg=asArr(e.rh[idx][3]).join('-'), many=asArr(target).length>1;
      if(misses===1&&many) fb.innerHTML=`Not quite. I'm listening for <b>${listNames(asArr(target))}</b> together, fingers ${fg}.`;
      else if(misses===1) fb.innerHTML=`That was ${ev.midi!=null?nm(ev.midi):'something else'}. We want <b>${many?listNames(asArr(target)):nm(target)}</b>, finger${many?'s':''} ${fg}.`;
      else { fb.innerHTML=`<b>${many?listNames(asArr(target)):nm(target)}</b>, with finger${many?'s':''} ${fg}. ${many?'They\'re':'It\'s'} glowing below.`; kb.hl(asArr(target),'hint'); }
    }
  };
  handler.wantsChords=!!e.chords;
}

function demoEx(e,qpm,accomp){
  stopRun(); const c=ac(), beat=60/qpm, start=c.currentTime+0.15; run={bus:newBus(),timers:[]};
  e.rh.forEach(n=>{ const ms=asArr(n[2]); ms.forEach(m=>{ tone(m,start-c.currentTime+n[0]*beat,n[1]*beat*0.95,{dest:run.bus,noMute:true,vol:0.32/Math.sqrt(ms.length)}); run.timers.push(setTimeout(()=>kb.flash(m),(start-c.currentTime+n[0]*beat)*1000)); }); });
  if(accomp) e.lh.forEach(l=>l[2].forEach(m=>tone(m,start-c.currentTime+l[0]*beat,l[1]*beat*0.95,{vol:0.14,dest:run.bus,noMute:true})));
  muteUntil=performance.now()+(e.total*beat+0.6)*1000;
}

function exTime(e,pref,o){
  stopRun(); const body=$('#exbody');
  const best=(store.get('ex',{})[e.no]||{}).best;
  body.innerHTML=`<p class="prompt" style="font-size:17px">I'll count you in with four clicks, then keep the beat. Keep going even if a note slips. The music doesn't stop, and neither do we.</p>
    <div class="opts">Tempo <div class="seg sm" id="tempo">${Object.keys(TEMPI).map(k=>`<button data-t="${k}" class="${pref.tempo===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
      <button class="ghost ${pref.accomp?'on':''}" id="tAcc">🎹 My left hand</button></div>
    <div class="count" id="count"></div>
    <div id="disp"></div>
    <div class="fb" id="fb">${best!=null?`Your best so far: ${Math.round(best*100)}% in time.`:'Tip: earbuds keep my playing out of the microphone.'}</div>
    <div class="row" id="ctl"><button class="primary" id="go">▶ Start</button></div>`;
  const draw=(cls,tag)=>{$('#disp').innerHTML=exStaff(e,cls||(()=>''),{fingers:true,names:false,tag});};
  draw();
  body.querySelectorAll('#tempo button').forEach(b=>b.onclick=()=>{pref.tempo=b.dataset.t;savePref(pref);body.querySelectorAll('#tempo button').forEach(x=>x.classList.toggle('on',x===b));});
  $('#tAcc').onclick=ev=>{pref.accomp=!pref.accomp;savePref(pref);ev.currentTarget.classList.toggle('on',pref.accomp);};
  $('#go').onclick=()=>startTimed(e,pref,o,draw);
}

function startTimed(e,pref,o,draw){
  stopRun(); const c=ac(); const qpm=TEMPI[pref.tempo], beat=60/qpm;
  const myRun={bus:newBus(),timers:[]}; run=myRun;
  const lat=(c.outputLatency||c.baseLatency||0);
  const t0=c.currentTime+0.35, start=t0+4*beat, end=start+e.total*beat;
  myRun.start=start; myRun.beat=beat;
  for(let i=0;i<4;i++) click(t0+i*beat,i===0,myRun.bus);
  for(let b=0;b<e.total;b++) click(start+b*beat,b%4===0,myRun.bus);
  if(pref.accomp) e.lh.forEach(l=>l[2].forEach(m=>tone(m,start-c.currentTime+l[0]*beat,l[1]*beat*0.95,{vol:0.12,dest:myRun.bus,noMute:true,accomp:true,pure:true})));
  const N=e.rh.length;
  const exp=e.rh.map((n,i)=>{ const t=start+n[0]*beat;
    const pg=(i>0?n[0]-e.rh[i-1][0]:4)*beat, ng=(i<N-1?e.rh[i+1][0]-n[0]:4)*beat;
    return {t,lo:t-Math.min(0.5*pg,0.45),hi:t+Math.min(0.5*ng,0.45),res:null,dt:0}; });
  let wrong=0, lastCur=-2, dirty=true;
  $('#ctl').innerHTML='<button class="ghost" id="stop">■ Stop</button>';
  $('#stop').onclick=()=>{stopRun();handler=null;exTime(e,pref,o);};
  const cls=i=>{const r=exp[i].res; if(r) return 'n-'+r; return i===lastCur?'n-cur':'';};
  const tag=i=>{const r=exp[i].res; return r==='early'?'early':r==='late'?'late':'';};
  const fb=()=>$('#fb');
  const taps={};
  handler=ev=>{ if(run!==myRun) return;
    const toT=t=>c.currentTime-(performance.now()-t)/1000-(ev.source==='mic'?lat+0.04:lat);
    let tt=toT(ev.t);
    const cands=exp.map((x,i)=>i).filter(i=>!exp[i].res&&tt>=exp[i].lo&&tt<=exp[i].hi);
    let hit=null, part=null, wrongHere=false;
    for(const i of cands){ const r=judge(ev,e.rh[i][2],taps);
      if(r.kind==='hit'){hit=i; if(r.t) tt=toT(r.t); break;}
      if(r.kind==='partial'&&!part) part=r; if(r.kind==='wrong') wrongHere=true; }
    if(hit!=null){ const dt=tt-exp[hit].t; exp[hit].dt=dt; exp[hit].res=Math.abs(dt)<=0.13?'ok':dt<0?'early':'late'; dirty=true; }
    else if(part&&!part.quiet){ const f=fb(); f.className='fb miss'; f.innerHTML=`Missing ${listNames(part.missing)}. Keep going!`; }
    else if(ev.midi!=null&&(wrongHere||!cands.length)&&tt>start-beat*0.5&&tt<end){ wrong++; const f=fb(); f.className='fb miss'; const wt=cands.length?e.rh[cands[0]][2]:null, want=wt!=null?lbl(wt):null; f.innerHTML=want&&Array.isArray(wt)?`Looking for ${want}. Keep going!`:want?`That was ${nm(ev.midi)}. Looking for ${want}. Keep going!`:`That was ${nm(ev.midi)}. Keep going!`; }
  };
  handler.wantsChords=!!e.chords;
  const tick=()=>{ if(run!==myRun) return;
    const now=c.currentTime-lat;
    const cd=Math.ceil((start-now)/beat);
    $('#count').textContent=now<start?(cd<=4&&cd>=1?String(5-cd):''):'';
    exp.forEach(x=>{ if(!x.res&&now>x.hi+0.08){x.res='miss';dirty=true;} });
    let curI=-1; for(let i=0;i<N;i++) if(exp[i].t<=now+0.05) curI=i;
    if(curI!==lastCur){lastCur=curI;dirty=true;}
    if(dirty){ dirty=false; draw(cls,tag); const box=$('#disp').querySelector(`[data-s="${sysIndexOf(e,Math.max(0,curI))}"]`); if(box&&curI>0) box.scrollIntoView({block:'nearest',behavior:'smooth'}); }
    if(now>end+0.5) return finish();
    myRun.raf=requestAnimationFrame(tick);
  };
  myRun.raf=requestAnimationFrame(tick);
  const finish=()=>{ handler=null; lastCur=-2;
    const cnt={ok:0,early:0,late:0,miss:0}; exp.forEach(x=>cnt[x.res||'miss']++);
    const score=(cnt.ok+0.6*(cnt.early+cnt.late))/N;
    const prevBest=(store.get('ex',{})[e.no]||{}).best||0;
    markEx(e.no,{best:Math.max(prevBest,score),learned:true});
    draw(cls,tag); $('#count').textContent='';
    let advice;
    if(cnt.miss>N*0.35) advice='Lots of notes slipped by. That just means the tempo is ahead of your fingers for now. Try <b>Learn the notes</b> once more, or the Slow tempo.';
    else if(cnt.late>cnt.early*2&&cnt.late>2) advice='You tend to arrive a little late. Very normal! Count "1, 2, 3, 4" out loud with the clicks and let the count pull your fingers along.';
    else if(cnt.early>cnt.late*2&&cnt.early>2) advice='Eager fingers! Let each note wait for its click. Long notes especially: hold them for their full count.';
    else if(score>=0.8) advice=pref.tempo==='slow'?'That\'s a real performance. When you\'re ready, try Steady.':pref.tempo==='steady'?'Lovely and steady. Brisk is waiting for you, whenever you like.':'Brisk! Carl marked this one even faster, but he also never slept.';
    else advice='Getting there. One more time usually helps more than you\'d expect.';
    const f=fb(); f.className='fb'+(score>=0.8?' good':'');
    f.innerHTML=`<div class="stats"><div><b>${cnt.ok}</b>on the beat</div><div><b>${cnt.early}</b>a bit early</div><div><b>${cnt.late}</b>a bit late</div><div><b>${cnt.miss}</b>slipped by</div></div>${score>prevBest&&prevBest>0?'<b>A new best!</b> ':''}${advice}`;
    $('#ctl').innerHTML=`<button class="primary" id="again">↺ Again</button>${o.onDone?'<button class="primary" id="fin">Finish today\'s practice</button>':'<button class="ghost" id="back">Back to the exercises</button>'}`;
    $('#again').onclick=()=>startTimed(e,pref,o,draw);
    if(o.onDone) $('#fin').onclick=o.onDone; else $('#back').onclick=home;
    setTimeout(()=>$('#ctl').scrollIntoView({block:'nearest',behavior:'smooth'}),60);
  };
}

/* ---------- start ---------- */
kb.build(); setStatus(); home();
</script>
